    <!-- Push44 – Base44 Badge Blocker -->
    <style>#base44-edit-badge,#base44-badge,.base44-badge,div[id*='base44'],[data-base44-badge],.made-with-base44,[class*='base44'],#admin-footer{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;}</style>
    <!-- Disable system gestures & selections for game / Play Store compliance -->
    <script>
      (function() {
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); }, false);
        document.addEventListener('selectstart', function(e) {
          var t = e.target;
          if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
          e.preventDefault();
        }, false);
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, false);
        document.addEventListener('touchmove', function(e) {
          if (e.touches && e.touches.length > 1) e.preventDefault();
        }, { passive: false });
      })();
    </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
