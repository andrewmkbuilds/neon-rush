buildscript {
    // Play Billing 8.x ships metadata compiled with Kotlin 2.2, so the compiler
    // must be 2.2+ or compileReleaseKotlin dies with "incompatible version of Kotlin".
    ext.kotlin_version = '2.2.10'
    repositories { google(); mavenCentral() }
    dependencies {
        // AGP 8.9+ is required to compile against SDK 36.
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}
allprojects { repositories { google(); mavenCentral() } }